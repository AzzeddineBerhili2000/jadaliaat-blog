<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جدليات</title>
  <meta name="description" content="جدليات — مدوّنة عربية نقدية تناقش الحجج التي يُستدَل بها على صحة الدين، بالدليل لا بالتسليم.">
  <meta name="theme-color" content="#F3EBDC">
  <meta property="og:type" content="website">
  <meta property="og:title" content="جدليات">
  <meta property="og:description" content="مدوّنة عربية نقدية تناقش الحجج الدينية بالدليل لا بالتسليم.">
  <meta property="og:locale" content="ar_AR">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231D1B18'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23F3EBDC' font-family='serif'%3E%D8%AC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sheet">
    <div class="sheet-in">
      <header class="mast">
        <a class="badge" href="#/">جدليات</a>
        <nav class="mast-nav" id="nav" aria-label="القائمة الرئيسية"></nav>
        <span class="mast-meta">العدد الأول · 2026</span>
      </header>
      <main id="app" tabindex="-1">
        <noscript><p class="noscript">يحتاج هذا الموقع إلى تفعيل جافاسكربت في المتصفح.</p></noscript>
      </main>
    </div>
  </div>
  <div class="readbar" id="readbar" hidden>
    <div class="rb-in">
      <button type="button" class="rb-btn" id="rb-toc" aria-expanded="false" aria-controls="toc-panel">☰ الفهرس</button>
      <span class="rb-title" id="rb-title"></span>
      <button type="button" class="rb-btn" id="rb-top" aria-label="العودة إلى أعلى المقال">↑</button>
    </div>
    <div class="rb-prog"><i id="rb-prog"></i></div>
  </div>
  <div class="toc-panel" id="toc-panel" hidden>
    <div class="tp-back" data-close></div>
    <div class="tp-box" role="dialog" aria-modal="true" aria-label="فهرس المقال">
      <div class="tp-head"><span class="tag">فهرس المقال</span><button type="button" class="rb-btn" data-close aria-label="إغلاق الفهرس">✕</button></div>
      <div id="tp-list"></div>
    </div>
  </div>
  <script src="articles.js"></script>
  <script src="app.js"></script>
</body>
</html>
