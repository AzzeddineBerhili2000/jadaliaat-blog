<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Jadaliaat video engine</title>
<style>
  /* Arabic glyphs from the arabic subset, Latin/digits from the latin subset */
  /* Amiri: full official fonts (the npm subsets mis-position vowel marks) */
  @font-face { font-family: Amiri; font-weight: 400; src: url(fonts/Amiri-Regular.ttf); }
  @font-face { font-family: Amiri; font-weight: 700; src: url(fonts/Amiri-Bold.ttf); }
  @font-face { font-family: AmiriQuran; font-weight: 400; src: url(fonts/AmiriQuran.ttf); }
  @font-face { font-family: Ruqaa; font-weight: 400; src: url(node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-400-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Ruqaa; font-weight: 700; src: url(node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-700-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Ruqaa; font-weight: 400; src: url(node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-latin-400-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Kufi; font-weight: 400; src: url(node_modules/@fontsource/reem-kufi/files/reem-kufi-arabic-400-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Kufi; font-weight: 600; src: url(node_modules/@fontsource/reem-kufi/files/reem-kufi-arabic-600-normal.woff2); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
  @font-face { font-family: Kufi; font-weight: 400; src: url(node_modules/@fontsource/reem-kufi/files/reem-kufi-latin-400-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+00D7; }
  @font-face { font-family: Kufi; font-weight: 600; src: url(node_modules/@fontsource/reem-kufi/files/reem-kufi-latin-600-normal.woff2); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+00D7; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
</body>
</html>
